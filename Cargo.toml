[package]
name = "stylus-poc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minimal Stylus contract for verification"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stylus-sdk = { version = "0.8.4", features = ["mini-alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"

[features]
export-abi = ["stylus-sdk/export-abi"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = 3
